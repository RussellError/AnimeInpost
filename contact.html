<!DOCTYPE html>

<head>

<style>
:root{
  --bg:#f5f7ff;
  --card:#ffffff;
  --header:#ffffff;
  --border:#dcdcdc;
  --text:#111;
  --muted:#666;
  --accent:#7a5cff;
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0b10;
    --card:#121522;
    --header:#0f111a;
    --border:#23263a;
    --text:#ffffff;
    --muted:#a8a8a8;
    --accent:#8b7dff;
  }
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:var(--header);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
}

.brand{
  color:var(--accent);
  font-size:22px;
  font-weight:bold;
  text-decoration:none;
}

.wrapper{
  max-width:850px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card h1{
  color:var(--accent);
  text-align:center;
  margin-bottom:25px;
}

.info{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}

.info h3{
  color:var(--accent);
  margin-bottom:10px;
}

.info p{
  color:var(--muted);
  line-height:1.6;
}

.info a{
  color:var(--accent);
  text-decoration:none;
  font-weight:bold;
}

.info a:hover{
  text-decoration:underline;
}

.note{
  text-align:center;
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

footer{
  margin-top:40px;
  padding:20px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
  background:var(--header);
}

.footer-card{
  background:var(--card);
  border:1px solid var(--border);
  padding:10px 18px;
  border-radius:10px;
  color:var(--muted);
  text-decoration:none;
  transition:.2s;
}

.footer-card:hover{
  color:var(--accent);
  border-color:var(--accent);
}

@media(max-width:768px){
  .wrapper{
    margin:20px auto;
    padding:15px;
  }

  .card{
    padding:20px;
  }

  .card h1{
    font-size:28px;
  }
}
</style>
</head>
