<script>
  initSearch({
    inputSelector: "#navSearchInput",
    resultsSelector: "#navSearchResults",
    dataUrl: "./data/search-index.json",
    seeAllUrl: "/series/"
  });

  // Trending Now (JSON-driven "Trending Comics" style row).
  // Rating/chapter numbers are refreshed live from /meta right after
  // the cached list paints — see trending-now.js.
  initTrendingNow({
    rootSelector: "#trendingNow",
    dataUrl: "./data/trending.json",
    metaDir: "./meta/"
  });

  // Popular (JSON-driven, Weekly/Monthly/All tabs).
  // Rating is refreshed live from /meta right after the cached list
  // paints — see popular.js.
  initPopular({
    rootSelector: "#popular",
    dataUrl: "./data/popular.json",
    metaDir: "./meta/"
  });

  // Desktop search overlay (Ctrl/Cmd+K style, 769px+)
  const desktopSearchEmptyState = `
    <div class="search-empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>Enter at least 3 characters to search.</p>
    </div>
  `;

  const desktopSearch = initSearch({
    inputSelector: "#desktopSearchModalInput",
    resultsSelector: "#desktopSearchModalResults",
    dataUrl: "./data/search-index.json",
    seeAllUrl: "/series/",
    emptyStateHtml: desktopSearchEmptyState
  });

  const desktopSearchTrigger = document.getElementById("desktopSearchTrigger");
  const desktopSearchOverlay = document.getElementById("desktopSearchOverlay");
  const desktopSearchModal = desktopSearchOverlay
    ? desktopSearchOverlay.querySelector(".desktop-search-modal")
    : null;
  const desktopSearchEsc = document.getElementById("desktopSearchModalEsc");

  function openDesktopSearch() {
    if (!desktopSearchOverlay) return;
    desktopSearchOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
    if (desktopSearch) desktopSearch.reset();
    // Focus after the overlay is visible so the click that opened it
    // doesn't immediately blur the input.
    requestAnimationFrame(() => {
      if (desktopSearch) desktopSearch.focus();
    });
  }

  function closeDesktopSearch() {
    if (!desktopSearchOverlay) return;
    desktopSearchOverlay.classList.remove("active");
    document.body.style.overflow = "";
  }

  if (desktopSearchTrigger) {
    desktopSearchTrigger.addEventListener("click", openDesktopSearch);
  }

  if (desktopSearchEsc) {
    desktopSearchEsc.addEventListener("click", closeDesktopSearch);
  }

  if (desktopSearchOverlay) {
    // Click on the dimmed backdrop (not the modal itself) closes it.
    desktopSearchOverlay.addEventListener("click", (e) => {
      if (desktopSearchModal && !desktopSearchModal.contains(e.target)) {
        closeDesktopSearch();
      }
    });
  }

  document.addEventListener("keydown", (e) => {
    const isOpen = desktopSearchOverlay && desktopSearchOverlay.classList.contains("active");

    if (isOpen && e.key === "Escape") {
      closeDesktopSearch();
      return;
    }

    // Ctrl+K / Cmd+K opens the overlay from anywhere (desktop only —
    // the trigger button itself is hidden below 769px via CSS).
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      if (desktopSearchTrigger && desktopSearchTrigger.offsetParent !== null) {
        e.preventDefault();
        openDesktopSearch();
      }
    }
  });

  // Resources dropdown toggle (desktop nav)
  const resourcesDropdown = document.getElementById("resourcesDropdown");
  const resourcesDropdownBtn = document.getElementById("resourcesDropdownBtn");
  if (resourcesDropdown && resourcesDropdownBtn) {
    resourcesDropdownBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      resourcesDropdown.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!resourcesDropdown.contains(e.target)) {
        resourcesDropdown.classList.remove("open");
      }
    });
  }
</script>
