<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support AnimeInpost</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d1a;
            color: #ffffff;
            line-height: 1.6;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            font-size: 1em;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border: 1px solid #333;
            background-color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            box-sizing: border-box;
        }

        h1 {
            color: #e0e0e0;
            font-size: 2em;
            margin-bottom: 15px;
        }

        p {
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        .donation-section {
            margin-top: 15px;
            padding: 20px;
            background-color: #21213a;
            border-radius: 8px;
            border: 1px solid #444;
        }

        /* Highlighting the preferred section */
        .preferred {
            border: 1px solid #ffb74d;
            background-color: #2a2a47;
        }

        h2 {
            font-size: 1.4em;
            color: #c0c0c0;
            margin-bottom: 10px;
        }

        .patreon-button {
            display: inline-block;
            background-color: #ffb74d;
            color: #1a1a2e;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .patreon-button:hover {
            background-color: #ffa726;
            transform: scale(1.05);
        }

        .crypto-addresses, .giftcards-section {
            margin-bottom: 20px;
        }

        .crypto-addresses p, .giftcards-section p {
            font-size: 0.9em;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .crypto-addresses span {
            display: block;
            background-color: #2a2a47;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 0.8em;
            cursor: pointer;
            position: relative;
        }

        .crypto-addresses span::after {
            content: "Click to copy";
            font-size: 0.7em;
            color: #aaa;
            display: block;
            margin-top: 3px;
        }

        .highlight-note {
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #bbb;
        }

        .giftcards-list {
            margin-top: 5px;
            text-align: left;
        }

        .giftcards-list li {
            margin-bottom: 5px;
        }

        .giftcards-list a {
            color: #ffb74d;
            text-decoration: none;
        }

        .giftcards-list a:hover {
            text-decoration: underline;
        }

        .additional-note {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }

        .contact-link {
            color: #ffb74d;
            text-decoration: none;
        }

        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support <a href="/" style="color: #e0e0e0; text-decoration: none;">AnimeInpost</a></h1>
        

        
        
        <div class="donation-section">
    <h2>Support Using Cryptocurrency & Digital Wallets</h2>

    <div class="crypto-addresses">
        <p>Bitcoin (BTC):</p>
        <span onclick="copyToClipboard(this)">1JQR1qVmmTgwBaDqZkfaHL1AMeF6JWYeR2</span>

        <p>Binance UID:</p>
        <span onclick="copyToClipboard(this)">553261708</span>

        <p>WebMoney Wallet: (USDT)</p>
        <span onclick="copyToClipboard(this)">T286437866795</span>
    </div>
</div>


    <script>
        function copyToClipboard(element) {
            const text = element.childNodes[0].textContent; // Adjusted to handle potential span content shifts
            navigator.clipboard.writeText(text).then(() => {
                const original = text;
                const tip = element.nextElementSibling; // If you want to add a popup, otherwise text toggle is fine
                
                // Simple visual feedback
                const oldContent = element.innerHTML;
                element.textContent = "Copied!";
                setTimeout(() => {
                    element.innerHTML = oldContent;
                }, 1000);
            });
        }
    </script>
</body>
</html>
