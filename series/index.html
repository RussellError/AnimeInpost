<script>
(function(){
  var trigger = document.getElementById('desktopSearchTrigger');
  var overlay = document.getElementById('desktopSearchOverlay');
  var input = document.getElementById('desktopSearchModalInput');
  var escBtn = document.getElementById('desktopSearchModalEsc');

  function openSearch(){
    if(!overlay) return;
    overlay.classList.add('active');
    if(input){ input.focus(); }
  }
  function closeSearch(){
    if(!overlay) return;
    overlay.classList.remove('active');
    if(input){ input.blur(); }
  }

  if(trigger){
    trigger.addEventListener('click', openSearch);
  }
  if(escBtn){
    escBtn.addEventListener('click', closeSearch);
  }
  if(overlay){
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ closeSearch(); }
    });
  }
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      openSearch();
    }
    if(e.key === 'Escape'){
      closeSearch();
    }
  });

  var dropdown = document.querySelector('.desktop-nav-dropdown');
  var dropdownBtn = document.querySelector('.desktop-nav-dropdown-btn');
  if(dropdown && dropdownBtn){
    dropdownBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    document.addEventListener('click', function(e){
      if(!dropdown.contains(e.target)){
        dropdown.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        dropdown.classList.remove('open');
      }
    });
  }
  if (typeof initSearch === 'function' && input) {
    initSearch({
      inputSelector: '#desktopSearchModalInput',
      resultsSelector: '#desktopSearchModalResults',
      dataUrl: '../data/search-index.json'
    });
  }
})();
</script>
