                <span class="rc-count" data-count="angry"></span>
                <span class="rc-label">Angry</span>
            </button>

            <button class="rc-reaction-btn" data-reaction="sad">
                <span class="rc-emoji"></span>
                <span class="rc-count" data-count="sad"></span>
                <span class="rc-label">Sad</span>
            </button>

        </div>
    </div>

    <!-- COMMENTS HEADER -->
    <div class="rc-comments-header">
        <h3 class="rc-comments-title" id="rcCommentsCount">
            0 Comments
        </h3>

        <div class="rc-sort-toggle">
            <button class="rc-sort-btn active" data-sort="newest">
                Newest
            </button>

            <button class="rc-sort-btn" data-sort="oldest">
                Oldest
            </button>
        </div>
    </div>

    <!-- COMMENT FORM -->
    <div class="rc-comment-form">

        <input
            type="text"
            class="rc-input"
            id="rcNameInput"
            placeholder="Your name"
            maxlength="50"
            autocomplete="name"
        >

        <input
            type="email"
            class="rc-input"
            id="rcEmailInput"
            placeholder="Email (optional, not displayed)"
            maxlength="100"
            autocomplete="email"
        >

        <textarea
            class="rc-comment-input"
            id="rcCommentInput"
            placeholder="Write a comment..."
            rows="4"
            maxlength="1000"
        ></textarea>

        <div class="rc-form-toolbar">
            <button class="rc-post-btn" id="rcPostBtn">
                Post Comment
            </button>
        </div>

    </div>

</section>

    <button id="scroll-top-btn" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>
