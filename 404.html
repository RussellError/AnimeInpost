<script>
/* Subtle cursor distortion */
document.addEventListener("mousemove", (e) => {

    const card = document.querySelector(".card");

    if (!card) return;

    const x =
        (window.innerWidth / 2 - e.clientX) * 0.01;

    const y =
        (window.innerHeight / 2 - e.clientY) * 0.01;

    card.style.transform =
        `translate(${x}px, ${y}px)`;

});
